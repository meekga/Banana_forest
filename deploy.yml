---
- name: One click deployment for Banana Forest Nginx
  hosts: localhost
  become: yes

  tasks:
    - name: 1.update rocky linux
      dnf: 
        name: "*"
        state: latest

    - name: 2.install git and Docker
      dnf:
        name: 
          - git
          - docker
        state: present

    - name: 3.start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: 4.pull from cloud
      git:
        repo: 'https://github.com/meekga/Banana_forest.git'
        dest: /opt/Banana_forest
        force: yes

    - name: 5.build Nginx iso
      docker_image:
        name: banana-nginx
        build:
          path: /opt/Banana_forest
        source: build

    - name: 6.start Nginx with Port 443
      docker_container:
        name: my-banana-server
        image: banana-nginx
        state: started
        restart_policy: always
        published_ports:
          - "443:443"









